services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 6000
      STORAGE_PATH: /var/lib/cloud-storage
      IMAGE_MAGICK_BIN: convert
    ports:
      - "6000:6000"
    volumes:
      - cloud-storage-data:/var/lib/cloud-storage
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:6000
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:6000
    depends_on:
      - api
    ports:
      - "6001:6001"
    restart: unless-stopped

volumes:
  cloud-storage-data:
